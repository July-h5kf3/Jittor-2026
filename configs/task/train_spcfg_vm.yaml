mode: train
debug: False
components:
  data: spcf_train
  transform: spcf
  system: spcfg_vm
  model: spcfg_vm
loss:
  loss: 1.0
optimizer:
  __target__: adam
  lr: 0.0001
trainer:
  epochs: 150
  save_best_only: True
  early_stopping:
    enabled: True
    monitor: val/loss_sum
    mode: min
    patience: 15
    min_delta: 0.0000005

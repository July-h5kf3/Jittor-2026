mode: train
debug: False
init_stage_ckpt: experiments/spcfgfnuni001_cvm/checkpoint_best.pkl
components:
  data: spcf_train_pd002
  transform: spcf_n_rot001
  system: spcfgfnuni001_spcf
  model: spcfgfnuni001_spcf
loss:
  loss: 1.0
optimizer:
  __target__: adam
  lr: 0.0001
trainer:
  epochs: 200
  save_best_only: True
  early_stopping:
    enabled: True
    monitor: val/loss_sum
    mode: min
    patience: 30
    min_delta: 0.0000005

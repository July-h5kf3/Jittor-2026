mode: train
debug: False
load_ckpt: experiments/spcfgfncvm002_spcf/checkpoint_best.pkl
components:
  data: spcf_train_pd002
  transform: spcf_n
  system: spcfgfnldc_spcf
  model: spcfgfnldc_spcf
loss:
  loss: 1.0
optimizer:
  __target__: adam
  lr: 0.00001
trainer:
  epochs: 80
  save_best_only: True
  initial_best_metric: 3.794236
  initial_best_epoch: 0
  early_stopping:
    enabled: True
    monitor: val/loss_sum
    mode: min
    patience: 15
    min_delta: 0.0000001

mode: predict
debug: False
load_ckpt: experiments/vm/checkpoint_best.pkl

components:
  data: predict
  transform: vm
  system: vm
  model: vm

writer:
  __target__: vm
  # asset paths already start with "dataset_test_noisy/", so save_dir is just
  # "results" -> outputs land in results/dataset_test_noisy/shapenet/<id>/denoised.npy
  # (matches the README packaging: cd results/dataset_test_noisy && zip -r result.zip shapenet/)
  save_dir: results
  save_name: denoised

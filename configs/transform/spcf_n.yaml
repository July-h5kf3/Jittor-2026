train_transform:
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.008
      noise_std_max: 0.014
      outlier_frac: 0.02
      outlier_scale: 3.0
    - __target__: linear
      scale: [0.8, 1.2]
      rotate_x_range: [-180, 180]
      rotate_y_range: [-180, 180]
      rotate_z_range: [-180, 180]
      scale_p: 0.5
      rotate_p: 0.5
    - __target__: patch_spcf
      patch_size: 1000
      num_patches: 1

# v2 clean val: fixed sig=0.011 (official-aligned, no random magnitude) and 8
# patches/cloud (averages out outlier-mask + patch-selection variance) -> low-
# variance, repeatable-in-expectation val so best-ckpt selection is reliable.
# (train_transform above is UNCHANGED -- it's what produced the 75.01 model.)
validate_transform: &validate_transform
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024
    - __target__: normalize_pc
    - __target__: add_noise
      noise_std_min: 0.011
      noise_std_max: 0.011
      outlier_frac: 0.02
      outlier_scale: 3.0
    - __target__: patch_spcf
      patch_size: 1000
      num_patches: 1

predict_transform:
  augments: []
